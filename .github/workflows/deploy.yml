name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Target commit SHA to validate and deploy'
        required: true
        default: '2fd8b294d5fd5c1ae8cefdc9fbafdad556177e72'
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'Tivva34/Jannes-Maskin-o-Smide' &&
        github.ref == 'refs/heads/main' &&
        inputs.commit_sha == '2fd8b294d5fd5c1ae8cefdc9fbafdad556177e72'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint (verification)
        run: npm run lint

      - name: Run tests (verification)
        run: npm test

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
