<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24282c"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="100%" stop-color="#7a828a"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="50%" stop-color="#ffa500"/>
      <stop offset="100%" stop-color="#fff275"/>
    </linearGradient>
  </defs>

  <!-- App icon background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect width="504" height="504" x="4" y="4" rx="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Brand Typography: JANNES -->
  <text x="256" y="112" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#f0f4f8" letter-spacing="5" text-anchor="middle">JANNES</text>

  <!-- Sparks radiating from impact -->
  <g fill="url(#sparkGrad)">
    <circle cx="256" cy="208" r="7"/>
    <path d="M256,192 L262,204 L256,200 L250,204 Z"/>
    <path d="M280,186 L283,200 L275,196 Z"/>
    <path d="M232,186 L237,196 L229,200 Z"/>
    <circle cx="218" cy="202" r="4"/>
    <circle cx="294" cy="202" r="4"/>
  </g>

  <!-- Hammer Striking Downward -->
  <g transform="translate(256, 175) rotate(-28)">
    <!-- Hammer Handle -->
    <rect x="-8" y="-76" width="16" height="74" rx="4" fill="url(#steelGrad)" stroke="#1a1c1e" stroke-width="3"/>
    <!-- Handle Grip accents -->
    <line x1="-8" y1="-60" x2="8" y2="-60" stroke="#ff9800" stroke-width="3"/>
    <line x1="-8" y1="-46" x2="8" y2="-46" stroke="#ff9800" stroke-width="3"/>
    <!-- Hammer Head -->
    <path d="M-22,-104 L22,-104 C25,-104 27,-101 27,-98 L25,-76 C25,-73 23,-70 20,-70 L-20,-70 C-23,-70 -25,-73 -25,-76 L-27,-98 C-27,-101 -25,-104 -22,-104 Z" fill="url(#goldGrad)" stroke="#1a1c1e" stroke-width="4"/>
  </g>

  <!-- Combined Anvil + Cogwheel Assembly -->
  <g id="anvil-gear">
    <!-- Machinery Gear (Right side) -->
    <g fill="url(#goldGrad)" stroke="#141618" stroke-width="5">
      <!-- Gear Teeth -->
      <path d="M 330 220 L 350 220 L 358 238 L 340 248 Z"/>
      <path d="M 364 254 L 382 260 L 382 280 L 362 284 Z"/>
      <path d="M 372 298 L 388 310 L 380 328 L 362 324 Z"/>
      <path d="M 358 340 L 368 358 L 352 372 L 338 358 Z"/>
      <path d="M 324 372 L 328 392 L 308 398 L 300 380 Z"/>
      <!-- Outer Gear Body Arc -->
      <path d="M 270 226 A 95 95 0 0 1 346 364 L 270 310 Z"/>
      <!-- Inner Hub -->
      <circle cx="286" cy="304" r="30" fill="url(#steelGrad)"/>
      <circle cx="286" cy="304" r="14" fill="#141618"/>
    </g>

    <!-- Blacksmith Anvil Body (Left side merging into gear) -->
    <g fill="url(#steelGrad)" stroke="#141618" stroke-width="6" stroke-linejoin="round">
      <!-- Flat striking face, horn (left beak), waist, and sturdy base -->
      <path d="M 190 226 L 310 226 C 314 226 316 230 314 234 L 302 266 C 298 276 302 286 312 290 L 314 292 C 304 316 294 340 286 352 L 200 352 L 194 370 L 174 370 L 176 352 L 186 338 C 196 324 198 300 188 286 L 166 266 C 146 266 120 262 108 248 C 124 238 160 232 190 226 Z"/>
      <!-- Heavy Base Foot -->
      <path d="M 170 370 L 290 370 L 284 394 L 164 394 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Highlight bevels on anvil face -->
    <path d="M 194 232 L 302 232" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Brand Typography: MASKIN & SMIDE -->
  <text x="256" y="446" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#ffb347" letter-spacing="3" text-anchor="middle">MASKIN &amp; SMIDE</text>
</svg>